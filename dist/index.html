<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紙飛行機デザインラボ</title>
<style>
/* base.css */
/* 共通の見た目の値（色・文字・角丸・影）。部品の CSS はここの変数を使う。 */
:root {
  /* 紙とインク */
  --paper: #fffdf6;
  --paper-2: #f7f2e4;
  --paper-edge: #e6dcc4;
  --ink: #2b3440;
  --ink-2: #5b6675;
  --ink-3: #8b95a3;
  /* 空と草 */
  --sky: #2f8fdd;
  --sky-deep: #1f6fb8;
  --sky-pale: #e3f2fd;
  --grass: #5fae4e;
  /* 操作の色 */
  --accent: #ff7a2f;        /* 飛ばすボタン・今回の軌跡 */
  --accent-deep: #e85f12;
  --accent-pale: #fff0e4;
  --good: #2fa56b;
  --warn: #e0a31a;
  --bad: #e2504a;
  /* 力の矢印 */
  --lift: #2f80ed;
  --drag: #e2504a;
  --gravity: #7cb518;
  /* 軌跡の4色（順番に使う） */
  --trail-0: #ff7a2f;
  --trail-1: #2f80ed;
  --trail-2: #27ae60;
  --trail-3: #9b51e0;
  /* 形 */
  --radius: 14px;
  --radius-s: 8px;
  --shadow: 0 10px 30px rgba(31, 60, 90, 0.18), 0 2px 6px rgba(31, 60, 90, 0.10);
  --shadow-s: 0 2px 8px rgba(31, 60, 90, 0.14);
  --panel-w: 372px;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-num: "Segoe UI", "Helvetica Neue", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #bfe3f7;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#panel-root { position: absolute; left: 0; top: 0; bottom: 0; z-index: 10; pointer-events: none; }
#panel-root > * { pointer-events: auto; }
#overlay-root { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#overlay-root > * { pointer-events: auto; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
input, select { font-family: inherit; font-size: inherit; color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: rgba(43, 52, 64, 0.22); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(43, 52, 64, 0.4); border: 2px solid transparent; background-clip: padding-box; }

/* overlays.css */
/* 3D画面の上に重ねる部品（タイトル・遊び方・右上のボタン・計器・操作バー・結果・ヒント） */
.ov-root {
  --ov-cx: 50%;
  --ov-dark: rgba(22, 32, 46, 0.66);
  --ov-dark-line: rgba(255, 255, 255, 0.14);
  --ov-card: rgba(255, 253, 246, 0.96);
}
.ov-root[data-mode="design"] { --ov-cx: calc((100% + var(--panel-w)) / 2); }

/* ---------- 出し入れ（なめらかに） ---------- */
.ov-part {
  position: absolute;
  opacity: 0; visibility: hidden;
  transition: opacity .28s ease, transform .34s cubic-bezier(.2, .8, .25, 1), visibility 0s linear .34s;
}
.ov-part.is-on { opacity: 1; visibility: visible; transition-delay: 0s; }
.ov-root > .ov-part:not(.is-on) { pointer-events: none !important; }

/* ---------- 右上のボタン列 ---------- */
.ov-topbar { top: 14px; right: 14px; display: flex; gap: 6px; transform: translateY(-8px); }
.ov-topbar.is-on { transform: none; }
.ov-tbtn {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 13px 0 10px;
  border: 1px solid var(--paper-edge); border-radius: 999px;
  background: var(--ov-card); color: var(--ink-2);
  box-shadow: var(--shadow-s);
  font-size: 13px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s, transform .15s, box-shadow .15s;
}
.ov-tbtn:hover { background: #fff; color: var(--ink); transform: translateY(-1px); }
.ov-tbtn:active { transform: translateY(0); }
.ov-tbtn:focus-visible, .ov-seg-b:focus-visible, .ov-cbtn:focus-visible, .ov-back:focus-visible, .ov-help-close:focus-visible {
  outline: 3px solid rgba(47, 143, 221, .55); outline-offset: 2px;
}
.ov-tbtn.is-on, .ov-tbtn.is-open { background: var(--sky); border-color: var(--sky-deep); color: #fff; }
.ov-tbtn.is-on:hover, .ov-tbtn.is-open:hover { background: #3b9be8; }
.ov-tbtn.is-muted { color: var(--ink-3); }
.ov-ico { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ov-ico svg { width: 100%; height: 100%; display: block; }
.ov-tbtn::after {
  content: attr(data-tip);
  position: absolute; top: calc(100% + 8px); right: 0;
  padding: 6px 10px; border-radius: 8px;
  background: rgba(22, 32, 46, .92); color: #fff;
  font-size: 12px; font-weight: 500; letter-spacing: 0;
  opacity: 0; transform: translateY(-3px); pointer-events: none;
  transition: opacity .15s, transform .15s; transition-delay: 0s;
}
.ov-tbtn:hover::after { opacity: 1; transform: none; transition-delay: .35s; }

/* ---------- コマ数 ---------- */
.ov-fps {
  top: 58px; right: 14px;
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 4px 12px 5px; border-radius: 999px;
  background: var(--ov-dark); color: #fff;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transform: translateY(-6px);
}
.ov-fps.is-on { transform: none; }
.ov-fps-n { display: inline-block; min-width: 2.2ch; text-align: right; font-size: 18px; font-weight: 800; line-height: 1.2; color: #7ee2a8; }
.ov-fps-u { font-size: 12px; font-weight: 600; opacity: .85; }
.ov-fps[data-level="mid"] .ov-fps-n { color: #ffd45c; }
.ov-fps[data-level="bad"] .ov-fps-n { color: #ff8f88; }

/* ---------- 計器 ---------- */
.ov-hud, .ov-tags, .ov-ctl, .ov-result, .ov-hint { left: var(--ov-cx); }
.ov-hud {
  top: 14px; transform: translate(-50%, -10px);
  width: 508px; padding: 10px 16px 9px;
  border-radius: 16px; background: var(--ov-dark); color: #fff;
  border: 1px solid var(--ov-dark-line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: var(--shadow-s);
}
.ov-hud.is-on { transform: translate(-50%, 0); }
.ov-hud-big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.ov-hud-cell { text-align: center; min-width: 0; }
.ov-hud-cell + .ov-hud-cell { border-left: 1px solid var(--ov-dark-line); }
.ov-hud-l { font-size: 12px; font-weight: 700; opacity: .72; letter-spacing: .08em; }
.ov-hud-v { display: flex; align-items: baseline; justify-content: center; gap: 3px; white-space: nowrap; }
.ov-hud-n { display: inline-block; min-width: 4.1ch; text-align: right; font-size: 29px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
.ov-hud-u { display: inline-block; min-width: 2.6ch; text-align: left; font-size: 12px; font-weight: 600; opacity: .8; }
.ov-hud-small {
  display: flex; align-items: center; justify-content: center; gap: 22px;
  margin-top: 6px; padding-top: 7px; border-top: 1px solid var(--ov-dark-line);
}
.ov-hud-sc { display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap; }
.ov-hud-sl { font-size: 12px; font-weight: 700; opacity: .72; letter-spacing: .06em; }
.ov-hud-sv { display: inline-block; min-width: 4.6ch; text-align: left; font-size: 15px; font-weight: 800; }
.ov-lamp {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 2px 12px 2px 9px; border-radius: 999px;
  background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .42);
  font-size: 13px; font-weight: 800; letter-spacing: .1em;
  transition: background .12s, color .12s;
}
.ov-lamp-dot { width: 12px; height: 12px; border-radius: 50%; background: #7d8794; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35); transition: background .12s, box-shadow .12s; }
.ov-lamp.is-on { background: rgba(226, 80, 74, .28); color: #ffd0cd; }
.ov-lamp.is-on .ov-lamp-dot { background: #ff4b43; box-shadow: 0 0 0 3px rgba(255, 75, 67, .28), 0 0 12px 2px rgba(255, 75, 67, .85); animation: ov-blink .7s ease-in-out infinite alternate; }
@keyframes ov-blink { from { opacity: 1; } to { opacity: .6; } }

.ov-tags { top: 128px; transform: translate(-50%, -6px); display: flex; gap: 8px; }
.ov-tags.is-on { transform: translate(-50%, 0); }
.ov-tag {
  display: none; padding: 4px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 800; letter-spacing: .06em; color: #fff;
  box-shadow: var(--shadow-s);
}
.ov-tag.is-on { display: inline-block; animation: ov-pop .25s cubic-bezier(.2, .8, .25, 1); }
.ov-tag-slow { background: var(--sky); }
.ov-tag-pause { background: var(--accent); }
@keyframes ov-pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

/* ---------- 操作バー ---------- */
.ov-ctl {
  bottom: 24px; transform: translate(-50%, 16px);
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 18px;
  background: var(--ov-dark); color: #fff; border: 1px solid var(--ov-dark-line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}
.ov-ctl.is-on { transform: translate(-50%, 0); }
.ov-sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--ov-dark-line); }
.ov-cam { display: flex; align-items: center; gap: 8px; }
.ov-seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(0, 0, 0, .22); }
.ov-seg-b {
  height: 36px; padding: 0 16px; border: 0; border-radius: 9px;
  background: transparent; color: rgba(255, 255, 255, .78);
  font-size: 14px; font-weight: 700; white-space: nowrap;
  transition: background .15s, color .15s;
}
.ov-seg-b:hover { color: #fff; background: rgba(255, 255, 255, .12); }
.ov-seg-b.is-on { background: #fff; color: var(--sky-deep); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.ov-kbd {
  display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 6px;
  background: rgba(255, 255, 255, .16); color: rgba(255, 255, 255, .9);
  font: 700 11px/1.5 var(--font-num); text-align: center; letter-spacing: .02em;
}
.ov-kbd-lead { background: rgba(255, 255, 255, .1); }
.ov-cbtn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 42px; padding: 0 12px; border: 0; border-radius: 12px;
  background: rgba(255, 255, 255, .12); color: #fff;
  font-size: 14px; font-weight: 700; white-space: nowrap;
  transition: background .15s, transform .15s;
}
.ov-cbtn:hover { background: rgba(255, 255, 255, .22); }
.ov-cbtn:active { transform: scale(.97); }
.ov-cbtn .ov-ico { width: 18px; height: 18px; }
.ov-cbtn-t { display: inline-block; }
.ov-cbtn:first-of-type .ov-cbtn-t { min-width: 4em; text-align: left; }
.ov-cbtn.is-on { background: var(--accent); }
.ov-cbtn.is-on:hover { background: #ff8c47; }
.ov-cbtn-sub { font-size: 12px; font-weight: 700; opacity: .8; }
.ov-cbtn-stop { background: rgba(226, 80, 74, .85); }
.ov-cbtn-stop:hover { background: var(--bad); }

/* ---------- 結果カード ---------- */
.ov-result {
  --tone: var(--good); --tone-bg: #e5f5ec; --tone-ink: #1c7d4d;
  bottom: 20px; width: min(1160px, calc(100% - 40px));
  transform: translate(-50%, 36px);
  display: grid; grid-template-columns: 468px 1fr; gap: 22px;
  padding: 16px 20px 16px 22px; border-radius: 20px;
  background: var(--ov-card); border: 1px solid var(--paper-edge);
  box-shadow: var(--shadow); color: var(--ink);
  overflow: hidden;
}
.ov-result.is-on { transform: translate(-50%, 0); }
.ov-result::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--tone); }
.ov-result[data-tone="caution"] { --tone: var(--warn); --tone-bg: #fdf1d3; --tone-ink: #94670a; }
.ov-result[data-tone="fun"] { --tone: var(--trail-3); --tone-bg: #efe4fb; --tone-ink: #7236b4; }
.ov-result[data-tone="away"] { --tone: var(--sky); --tone-bg: var(--sky-pale); --tone-ink: var(--sky-deep); }
.ov-res-left { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-width: 0; }
.ov-res-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ov-res-badge { display: inline-flex; width: 34px; height: 34px; padding: 6px; flex: none; border-radius: 50%; background: var(--tone-bg); color: var(--tone-ink); }
.ov-res-badge svg { width: 100%; height: 100%; display: block; }
.ov-res-headline { margin: 0; font-size: 25px; font-weight: 800; line-height: 1.25; letter-spacing: .01em; color: var(--tone-ink); }
.ov-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ov-tile { padding: 8px 6px 8px; border-radius: 12px; background: var(--paper-2); border: 1px solid var(--paper-edge); text-align: center; min-width: 0; }
.ov-tile-l { font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.ov-tile-v { display: flex; align-items: baseline; justify-content: center; gap: 3px; white-space: nowrap; }
.ov-tile-n { font-size: 31px; font-weight: 800; line-height: 1.2; color: var(--ink); letter-spacing: -.01em; }
.ov-tile-u { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.ov-res-right { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0; }
.ov-res-label { display: inline-block; margin-bottom: 3px; padding: 1px 10px; border-radius: 999px; background: var(--tone-bg); color: var(--tone-ink); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
.ov-res-text { margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink); max-height: 7.2em; overflow-y: auto; }
.ov-res-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.ov-legend { display: grid; grid-template-columns: auto auto; gap: 3px 22px; }
.ov-leg { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.ov-leg-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--paper-edge); }
.ov-leg-n { min-width: 3.4em; font-weight: 600; }
.ov-leg-v { font-size: 13px; }
.ov-leg.is-cur { color: var(--ink); font-weight: 800; }
.ov-leg.is-cur .ov-leg-n { font-weight: 800; }
.ov-back {
  display: inline-flex; align-items: center; gap: 10px; flex: none;
  height: 46px; padding: 0 16px 0 22px; border: 0; border-radius: 14px;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 800; letter-spacing: .04em;
  box-shadow: 0 4px 0 var(--accent-deep), 0 8px 16px rgba(232, 95, 18, .28);
  transition: transform .12s, box-shadow .12s, background .15s;
}
.ov-back:hover { background: #ff8a45; transform: translateY(-1px); }
.ov-back:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.ov-kbd-on { background: rgba(255, 255, 255, .26); color: #fff; }

/* ---------- ヒント ---------- */
.ov-hint {
  bottom: 16px; transform: translate(-50%, 6px);
  padding: 5px 16px; border-radius: 999px;
  background: rgba(22, 32, 46, .38); color: rgba(255, 255, 255, .95);
  font-size: 13px; font-weight: 600; letter-spacing: .04em; white-space: nowrap;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  pointer-events: none;
}
.ov-hint.is-on { transform: translate(-50%, 0); }

/* ---------- 遊び方 ---------- */
.ov-help {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; background: rgba(20, 34, 52, .5);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  opacity: 0; visibility: hidden; pointer-events: none !important;
  transition: opacity .22s ease, visibility 0s linear .22s;
}
.ov-help.is-on { opacity: 1; visibility: visible; pointer-events: auto !important; transition-delay: 0s; }
.ov-root[data-mode="design"] .ov-help { padding-left: calc(var(--panel-w) + 20px); }
.ov-help-card {
  width: min(900px, 100%); max-height: 100%; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  padding: 20px 26px 20px; border-radius: 22px;
  background: var(--paper); border: 1px solid var(--paper-edge); box-shadow: var(--shadow);
  transform: translateY(14px) scale(.98); transition: transform .3s cubic-bezier(.2, .8, .25, 1);
}
.ov-help.is-on .ov-help-card { transform: none; }
.ov-help-head { display: flex; align-items: center; gap: 12px; }
.ov-help-logo { display: inline-flex; width: 48px; }
.ov-help-logo svg { width: 100%; display: block; filter: drop-shadow(0 2px 3px rgba(31, 60, 90, .3)); }
.ov-help-title { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .06em; color: var(--ink); }
.ov-help-body { display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; }
.ov-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ov-step { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 14px; background: #fff; border: 1px solid var(--paper-edge); }
.ov-step-ico { display: inline-flex; flex: none; width: 46px; height: 46px; padding: 3px; border-radius: 12px; background: var(--sky-pale); }
.ov-step-ico svg { width: 100%; height: 100%; display: block; }
.ov-step-no { position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font: 800 11px/18px var(--font-num); text-align: center; box-shadow: 0 0 0 2px #fff; }
.ov-step-t { font-size: 13.5px; line-height: 1.55; color: var(--ink); }
.ov-help-side { display: flex; flex-direction: column; gap: 16px; }
.ov-sub { margin: 0 0 7px; font-size: 15px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.ov-sub::before { content: ""; width: 5px; height: 16px; border-radius: 3px; background: var(--accent); }
.ov-try-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ov-try-list li { position: relative; padding: 7px 12px 7px 32px; border-radius: 10px; background: var(--accent-pale); font-size: 13.5px; line-height: 1.5; }
.ov-try-list li::before { content: ""; position: absolute; left: 11px; top: 13px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); opacity: .85; }
.ov-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.ov-key-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.ov-keycap { display: inline-block; min-width: 26px; padding: 1px 8px; border-radius: 7px; background: #fff; border: 1px solid var(--paper-edge); border-bottom-width: 3px; font: 700 12px/1.55 var(--font-num); color: var(--ink); text-align: center; }
.ov-key-row:last-child { grid-column: 1 / -1; }
.ov-help-foot { display: flex; justify-content: center; }
.ov-help-close {
  min-width: 190px; height: 48px; padding: 0 28px; border: 0; border-radius: 14px;
  background: var(--sky); color: #fff; font-size: 16px; font-weight: 800; letter-spacing: .08em;
  box-shadow: 0 4px 0 var(--sky-deep);
  transition: transform .12s, box-shadow .12s, background .15s;
}
.ov-help-close.is-first { background: var(--accent); box-shadow: 0 4px 0 var(--accent-deep), 0 8px 16px rgba(232, 95, 18, .28); }
.ov-help-close:hover { filter: brightness(1.07); transform: translateY(-1px); }
.ov-help-close:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-deep); }

/* ---------- タイトル ---------- */
.ov-title {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #2f8fdd 0%, #6bb8ee 42%, #bfe3f7 78%, #eaf6fc 100%);
  opacity: 0; visibility: hidden; pointer-events: none !important;
  transition: opacity .5s ease, visibility 0s linear .5s;
}
.ov-title.is-on { opacity: 1; visibility: visible; pointer-events: auto !important; transition: none; }
.ov-title.is-on.is-out { opacity: 0; transition: opacity .5s ease; }
.ov-title.is-gone { transition: none; }
.ov-title-inner { display: flex; flex-direction: column; align-items: center; text-align: center; }
.ov-title-logo { position: relative; width: 240px; height: 160px; margin-bottom: 10px; }
.ov-title-fly { position: absolute; inset: 0; animation: ov-fly 1s cubic-bezier(.16, .8, .3, 1) both; filter: drop-shadow(0 12px 10px rgba(20, 70, 120, .28)); }
.ov-title-fly svg { width: 100%; height: 100%; display: block; }
.ov-title-shadow { position: absolute; left: 50%; bottom: -10px; width: 170px; height: 18px; margin-left: -85px; border-radius: 50%; background: radial-gradient(closest-side, rgba(30, 80, 120, .28), transparent); animation: ov-shadow 1s ease-out both; }
@keyframes ov-fly {
  0% { opacity: 0; transform: translate(-340px, 90px) rotate(-14deg) scale(.7); }
  35% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
@keyframes ov-shadow { from { opacity: 0; transform: scaleX(.4); } to { opacity: 1; transform: none; } }
.ov-title-h {
  margin: 0; font-size: 52px; font-weight: 900; letter-spacing: .1em; color: #fff;
  text-shadow: 0 2px 0 rgba(31, 111, 184, .55), 0 6px 22px rgba(20, 70, 130, .45);
  animation: ov-rise .7s .35s cubic-bezier(.2, .8, .25, 1) both;
}
.ov-title-s {
  margin: 12px 0 0; font-size: 19px; font-weight: 700; letter-spacing: .14em; color: #164a7a;
  animation: ov-rise .7s .55s cubic-bezier(.2, .8, .25, 1) both;
}
@keyframes ov-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .ov-title-fly, .ov-title-shadow, .ov-title-h, .ov-title-s { animation-duration: .01s; animation-delay: 0s; }
}

/* panel.css */
/* 左の設計パネル。クラス名はすべて pn- で始める。色・角丸・影は base.css の変数を使う。 */

.pn-panel {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: var(--panel-w);
  display: flex; flex-direction: column;
  background: var(--paper);
  border-right: 1px solid var(--paper-edge);
  box-shadow: 8px 0 32px rgba(31, 60, 90, 0.20), 2px 0 6px rgba(31, 60, 90, 0.08);
  color: var(--ink);
  font-family: var(--font);
  transform: translateX(0);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0s;
}
.pn-panel.pn-hidden {
  transform: translateX(-105%);
  visibility: hidden;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0.35s;
}

.pn-scroll {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 0 6px 22px 14px;
  scrollbar-gutter: stable;
}

/* ---------- 見出し ---------- */
.pn-head { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; }
.pn-logo { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 2px 3px rgba(31, 111, 184, 0.35)); }
.pn-title { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 800; letter-spacing: 0.04em; color: var(--ink); }
.pn-sub { margin: 3px 0 0; font-size: 12px; color: var(--ink-2); letter-spacing: 0.02em; }

.pn-sec { margin: 0 0 8px; }
.pn-h2 { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.pn-h2::before { content: ""; width: 4px; height: 13px; border-radius: 2px; background: var(--sky); }
.pn-h2-row { display: flex; align-items: baseline; justify-content: space-between; }
.pn-h2-row .pn-h2 { margin-bottom: 8px; }

/* ---------- お手本 ---------- */
.pn-presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pn-preset {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px 6px;
  background: #fff; border: 1.5px solid var(--paper-edge); border-radius: 10px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 1px 3px rgba(31, 60, 90, 0.08);
  transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s, background 0.12s;
  min-width: 0;
}
.pn-preset:hover { transform: translateY(-1px); border-color: #a9cbe8; box-shadow: 0 3px 8px rgba(31, 60, 90, 0.14); }
.pn-preset:active { transform: translateY(0); }
.pn-preset:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.pn-preset.pn-selected { border-color: var(--sky); background: var(--sky-pale); box-shadow: 0 0 0 2px rgba(47, 143, 221, 0.22), 0 2px 6px rgba(31, 111, 184, 0.18); }
.pn-preset-warn:hover { border-color: #ecc66a; }
.pn-preset-warn.pn-selected { border-color: var(--warn); background: #fff6dc; box-shadow: 0 0 0 2px rgba(224, 163, 26, 0.28), 0 2px 6px rgba(160, 110, 0, 0.18); }
.pn-preset-name { font-size: 11px; font-weight: 700; line-height: 1.2; white-space: nowrap; color: var(--ink); letter-spacing: 0; }
.pn-preset-warn .pn-preset-name { color: #9a6a00; }

.pn-sil { width: 100%; height: auto; aspect-ratio: 41 / 31.5; display: block; overflow: visible; }
.pn-sil-wing { fill: rgba(47, 143, 221, 0.28); stroke: var(--sky-deep); stroke-width: 1.2; stroke-linejoin: round; }
.pn-sil-tail { fill: rgba(47, 143, 221, 0.38); stroke: var(--sky-deep); stroke-width: 1.2; stroke-linejoin: round; }
.pn-sil-body { stroke: var(--sky-deep); stroke-width: 1.1; stroke-dasharray: 2.4 1.6; }
.pn-sil-fin { stroke: var(--sky-deep); stroke-width: 2.4; stroke-linecap: round; }
.pn-preset-warn .pn-sil-wing { fill: rgba(224, 163, 26, 0.30); stroke: #b47c00; }
.pn-preset-warn .pn-sil-tail { fill: rgba(224, 163, 26, 0.42); stroke: #b47c00; }
.pn-preset-warn .pn-sil-body, .pn-preset-warn .pn-sil-fin { stroke: #b47c00; }

.pn-blurb { margin: 8px 2px 0; min-height: 20px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.pn-blurb b { color: var(--sky-deep); font-weight: 800; }
.pn-blurb-warn b { color: #a06c00; }
.pn-blurb-idle { color: var(--ink-3); }

/* ---------- 設計図（上に残る） ---------- */
.pn-sentinel { height: 0; }
.pn-bp { position: sticky; top: 0; z-index: 6; padding: 6px 0 12px; margin-left: 0; background: var(--paper); }
.pn-bp::after {
  content: ""; position: absolute; left: -14px; right: -6px; bottom: 0; height: 10px;
  transform: translateY(100%); pointer-events: none; opacity: 0; transition: opacity 0.15s;
  background: linear-gradient(180deg, rgba(31, 60, 90, 0.16), rgba(31, 60, 90, 0));
}
.pn-bp.pn-stuck::after { opacity: 1; }
.pn-bp-card {
  background: #fff; border: 1px solid var(--paper-edge); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-s);
}
.pn-bp-canvas { display: block; width: 100%; height: 252px; }
.pn-stats { display: grid; grid-template-columns: 0.8fr 1.5fr 1.15fr; border-top: 1px solid var(--paper-edge); background: var(--paper); }
.pn-st { padding: 7px 10px 8px; min-width: 0; }
.pn-st + .pn-st { border-left: 1px solid var(--paper-edge); }
.pn-st-l { display: block; font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.02em; white-space: nowrap; }
.pn-st-row { display: flex; align-items: center; gap: 6px; margin-top: 1px; flex-wrap: nowrap; }
.pn-st-v { font-size: 15px; font-weight: 800; color: var(--ink); white-space: nowrap; font-family: var(--font-num); }
.pn-badge { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.5; color: #fff; }
.pn-badge-good { background: var(--good); }
.pn-badge-warn { background: var(--warn); color: #4a3500; }
.pn-badge-bad { background: var(--bad); }

/* ---------- 設計項目 ---------- */
.pn-groups { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.pn-card {
  background: #fff; border: 1px solid var(--paper-edge); border-radius: var(--radius);
  padding: 10px 14px 4px; box-shadow: var(--shadow-s);
}
.pn-h2-card { margin: 0 0 2px; font-size: 13px; color: var(--ink); letter-spacing: 0.12em; }
.pn-card[data-group="tail"] .pn-h2::before { background: #35b6a4; }
.pn-card[data-group="weight"] .pn-h2::before { background: var(--accent); }
.pn-card[data-group="paper"] .pn-h2::before { background: #c9b98b; }
.pn-card[data-group="throw"] .pn-h2::before { background: var(--trail-3); }
.pn-card[data-group="env"] .pn-h2::before { background: var(--grass); }

.pn-item { position: relative; padding: 9px 0 17px; }
.pn-item + .pn-item { border-top: 1px dashed #eee6d2; }
.pn-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 22px; }
.pn-label { position: relative; display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 700; color: var(--ink); }
.pn-has-tip { cursor: help; }
.pn-q {
  width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 10px; font-weight: 800; color: var(--ink-3); background: var(--paper-2); border: 1px solid var(--paper-edge);
  line-height: 1;
}
.pn-has-tip:hover .pn-q { color: #fff; background: var(--sky); border-color: var(--sky); }
.pn-tip {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 30;
  width: max-content; max-width: 260px; padding: 7px 10px;
  background: var(--ink); color: #fff; border-radius: var(--radius-s);
  font-size: 12px; font-weight: 500; line-height: 1.5; letter-spacing: 0;
  box-shadow: var(--shadow); pointer-events: none;
  opacity: 0; transform: translateY(-3px); transition: opacity 0.12s, transform 0.12s;
}
.pn-tip::before { content: ""; position: absolute; left: 14px; top: -5px; border: 5px solid transparent; border-top: 0; border-bottom-color: var(--ink); }
.pn-has-tip:hover .pn-tip { opacity: 1; transform: translateY(0); }

.pn-val { display: inline-flex; align-items: baseline; gap: 0; white-space: nowrap; }
.pn-num { font-family: var(--font-num); font-size: 16px; font-weight: 800; color: var(--sky-deep); }
.pn-unit { font-size: 12px; color: var(--ink-2); font-weight: 600; margin-left: 2px; }
.pn-unit-tight { margin-left: 0; font-size: 13px; }
.pn-word { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-left: 6px; }

/* ---------- スライダー ---------- */
.pn-slider { position: relative; height: 28px; margin-top: 4px; --p: 0; --pl: 1; }
.pn-decor { position: absolute; inset: 0; pointer-events: none; }
.pn-trk {
  position: absolute; left: 0; right: 0; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px;
  background: #e9e2cf; box-shadow: inset 0 1px 2px rgba(80, 60, 20, 0.28), 0 1px 0 rgba(255, 255, 255, 0.9);
  overflow: hidden;
}
.pn-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: calc(11px + (100% - 22px) * var(--p));
  background: linear-gradient(180deg, #62b5f2, var(--sky) 55%, var(--sky-deep));
  border-radius: 4px 0 0 4px;
}
.pn-card[data-group="tail"] .pn-fill { background: linear-gradient(180deg, #62d0c0, #35b6a4 55%, #279183); }
.pn-card[data-group="weight"] .pn-fill { background: linear-gradient(180deg, #ffa56b, var(--accent) 55%, var(--accent-deep)); }
.pn-card[data-group="paper"] .pn-fill { background: linear-gradient(180deg, #dccb9a, #c9b98b 55%, #ab9a68); }
.pn-card[data-group="throw"] .pn-fill { background: linear-gradient(180deg, #bf86ef, var(--trail-3) 55%, #7d38c2); }
.pn-card[data-group="env"] .pn-fill { background: linear-gradient(180deg, #8ad07a, var(--grass) 55%, #46903a); }
.pn-lock {
  display: none; position: absolute; top: 0; bottom: 0; right: 0;
  left: calc(11px + (100% - 22px) * var(--pl));
  background:
    repeating-linear-gradient(135deg, rgba(120, 128, 140, 0.55) 0 2px, rgba(0, 0, 0, 0) 2px 5px),
    #d3d1c8;
  box-shadow: inset 1px 0 0 rgba(90, 96, 108, 0.7);
}
.pn-locked .pn-lock { display: block; }
.pn-mid { position: absolute; left: 50%; top: -1px; bottom: -1px; width: 2px; margin-left: -1px; background: rgba(43, 52, 64, 0.38); border-radius: 1px; z-index: 1; }

.pn-range {
  -webkit-appearance: none; appearance: none;
  position: absolute; inset: 0; width: 100%; height: 28px; margin: 0; padding: 0;
  background: transparent; cursor: pointer; outline: none;
}
.pn-range::-webkit-slider-runnable-track { -webkit-appearance: none; height: 28px; background: transparent; border: 0; }
.pn-range::-moz-range-track { height: 28px; background: transparent; border: 0; }
.pn-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; margin-top: 3px; border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #ffffff 0 38%, #f1ede0 100%);
  border: 2px solid var(--sky-deep);
  box-shadow: 0 2px 5px rgba(31, 60, 90, 0.35), 0 0 0 0 rgba(47, 143, 221, 0);
  transition: transform 0.1s, box-shadow 0.12s;
}
.pn-range::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #ffffff 0 38%, #f1ede0 100%);
  border: 2px solid var(--sky-deep);
  box-shadow: 0 2px 5px rgba(31, 60, 90, 0.35);
}
.pn-card[data-group="tail"] .pn-range::-webkit-slider-thumb { border-color: #279183; }
.pn-card[data-group="weight"] .pn-range::-webkit-slider-thumb { border-color: var(--accent-deep); }
.pn-card[data-group="paper"] .pn-range::-webkit-slider-thumb { border-color: #9a8955; }
.pn-card[data-group="throw"] .pn-range::-webkit-slider-thumb { border-color: #7d38c2; }
.pn-card[data-group="env"] .pn-range::-webkit-slider-thumb { border-color: #46903a; }
.pn-range:hover::-webkit-slider-thumb { transform: scale(1.08); }
.pn-range:active::-webkit-slider-thumb { transform: scale(1.16); box-shadow: 0 3px 8px rgba(31, 60, 90, 0.4), 0 0 0 6px rgba(47, 143, 221, 0.16); }
.pn-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 2px 5px rgba(31, 60, 90, 0.35), 0 0 0 4px rgba(47, 143, 221, 0.35); }
.pn-range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgba(47, 143, 221, 0.35); }

.pn-lock-note, .pn-ends {
  position: absolute; left: 0; right: 0; top: 100%; margin-top: 1px;
  font-size: 10.5px; line-height: 1.4; color: var(--ink-3);
}
.pn-lock-note { display: none; text-align: right; color: #7a7f8a; font-weight: 600; }
.pn-locked .pn-lock-note { display: block; }
.pn-ends { display: flex; justify-content: space-between; font-weight: 600; }

/* ---------- 風の方位盤 ---------- */
.pn-ctl-wind { display: flex; align-items: center; gap: 12px; }
.pn-ctl-wind .pn-slider { flex: 1; min-width: 0; margin-top: 0; }
.pn-compass { width: 62px; height: 62px; flex: none; transition: opacity 0.2s; }
.pn-cp-ring { fill: #f6fbff; stroke: #a9cbe8; stroke-width: 1.5; }
.pn-cp-ring2 { fill: none; stroke: #d6e7f5; stroke-width: 1; stroke-dasharray: 2 3; }
.pn-cp-tick { stroke: #a9bfd3; stroke-width: 1; }
.pn-cp-tick-major { stroke: var(--sky-deep); stroke-width: 1.8; }
.pn-cp-arrow { }
.pn-cp-shaft { stroke: var(--sky); stroke-width: 3.2; stroke-linecap: round; }
.pn-cp-head { fill: var(--sky); stroke: var(--sky); stroke-width: 1.5; stroke-linejoin: round; }
.pn-cp-plane { fill: #fff; stroke: var(--ink-2); stroke-width: 1.3; stroke-linejoin: round; }
.pn-calm .pn-compass { opacity: 0.32; }
.pn-calm .pn-num { color: var(--ink-3); font-size: 14px; }

/* ---------- スイッチ ---------- */
.pn-item-bool { padding-bottom: 12px; }
.pn-switch-wrap { display: inline-flex; align-items: center; gap: 10px; }
.pn-switch-state { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.pn-switch {
  position: relative; width: 50px; height: 28px; padding: 0; border: 0; border-radius: 14px;
  background: #d9d2bf; box-shadow: inset 0 1px 3px rgba(80, 60, 20, 0.35); transition: background 0.18s;
}
.pn-switch-knob {
  position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 4px rgba(31, 60, 90, 0.35); transition: transform 0.18s;
}
.pn-switch.pn-on { background: linear-gradient(180deg, #8ad07a, var(--grass)); }
.pn-switch.pn-on .pn-switch-knob { transform: translateX(22px); }
.pn-switch:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

/* ---------- 保存 ---------- */
.pn-count { font-family: var(--font-num); font-size: 12px; font-weight: 700; color: var(--ink-2); }
.pn-count-full { color: var(--bad); }
.pn-card-saves { padding: 12px 14px 8px; }
.pn-saveform { display: flex; gap: 8px; }
.pn-input {
  flex: 1; min-width: 0; height: 36px; padding: 0 12px;
  background: var(--paper); border: 1.5px solid var(--paper-edge); border-radius: var(--radius-s);
  font-size: 14px; color: var(--ink); outline: none; user-select: text;
  box-shadow: inset 0 1px 2px rgba(80, 60, 20, 0.10);
}
.pn-input::placeholder { color: var(--ink-3); }
.pn-input:focus { border-color: var(--sky); background: #fff; box-shadow: 0 0 0 3px rgba(47, 143, 221, 0.18); }
.pn-btn {
  height: 32px; padding: 0 12px; border-radius: var(--radius-s);
  border: 1.5px solid var(--paper-edge); background: #fff; color: var(--ink);
  font-size: 12.5px; font-weight: 700; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, transform 0.08s;
}
.pn-btn:hover { background: var(--sky-pale); border-color: #a9cbe8; }
.pn-btn:active { transform: translateY(1px); }
.pn-btn:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.pn-btn-primary { height: 36px; padding: 0 18px; font-size: 14px; background: var(--sky); border-color: var(--sky-deep); color: #fff; box-shadow: 0 2px 0 var(--sky-deep); }
.pn-btn-primary:hover { background: #3f9de6; border-color: var(--sky-deep); }
.pn-btn-primary:active { transform: translateY(2px); box-shadow: none; }
.pn-err { margin: 8px 2px 0; font-size: 12.5px; font-weight: 700; color: var(--bad); line-height: 1.5; }
.pn-err[hidden] { display: none; }
.pn-savelist { list-style: none; margin: 10px 0 0; padding: 0; }
.pn-save { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px dashed #eee6d2; }
.pn-save-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pn-save-name { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pn-save-date { font-size: 11px; color: var(--ink-3); font-family: var(--font-num); }
.pn-btn-load { background: var(--sky-pale); border-color: #b7d7ee; color: var(--sky-deep); }
.pn-btn-del { color: var(--ink-2); min-width: 86px; padding: 0 8px; }
.pn-btn-del:hover { background: #fdecea; border-color: #efb4b0; color: var(--bad); }
.pn-btn-del.pn-confirm { background: var(--bad); border-color: #c13b35; color: #fff; }
.pn-empty { padding: 14px 0 10px; text-align: center; font-size: 13px; color: var(--ink-3); }

/* ---------- 飛ばす（いちばん下に固定） ---------- */
.pn-foot {
  flex: none; padding: 12px 16px 16px; background: var(--paper);
  border-top: 1px solid var(--paper-edge);
  box-shadow: 0 -8px 16px -8px rgba(31, 60, 90, 0.16);
  position: relative; z-index: 7;
}
.pn-fly {
  position: relative; width: 100%; height: 58px; border: 0; border-radius: 16px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: #fff; font-size: 22px; font-weight: 800; letter-spacing: 0.3em; text-indent: 0.3em;
  text-shadow: 0 1px 2px rgba(150, 50, 0, 0.45);
  background: linear-gradient(180deg, #ff9c5f 0%, var(--accent) 52%, #f26a1b 100%);
  box-shadow: 0 5px 0 #c24a08, 0 9px 18px rgba(232, 95, 18, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  transition: transform 0.08s, box-shadow 0.08s, filter 0.12s;
}
.pn-fly:hover { filter: brightness(1.06); }
.pn-fly:active { transform: translateY(4px); box-shadow: 0 1px 0 #c24a08, 0 3px 8px rgba(232, 95, 18, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
.pn-fly:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.pn-fly:disabled { cursor: not-allowed; filter: grayscale(0.85) brightness(1.05); opacity: 0.6; box-shadow: 0 5px 0 #8d8d8d; }
.pn-fly-icon { width: 26px; height: 26px; color: #fff; filter: drop-shadow(0 1px 1px rgba(150, 50, 0, 0.5)); }
.pn-kbd {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  padding: 2px 8px; border-radius: 6px; font-family: var(--font-num); font-size: 11px; font-weight: 700; letter-spacing: 0.02em; text-indent: 0;
  background: rgba(255, 255, 255, 0.24); border: 1px solid rgba(255, 255, 255, 0.5); text-shadow: none; color: #fff;
}

@media (max-height: 780px) {
  .pn-bp-canvas { height: 190px; }
  .pn-bp { padding: 4px 0 10px; }
  .pn-st { padding: 5px 10px 6px; }
  .pn-st-v { font-size: 14px; }
